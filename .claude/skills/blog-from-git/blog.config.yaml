# blog.config.yaml — the editorial constitution for bilko.run/blog
#
# THIS FILE IS THE AUTHORITY. Every rule the sub-skill files (rotation.md, scan.md,
# research.md, ground.md, voice.md, seed.md) explain in prose derives from a value here.
# If prose and this file ever disagree, this file wins — fix the prose.
# Change editorial policy by changing THIS file, not by editing rules scattered in prose.

identity:
  site: https://bilko.run/blog
  author: Bilko            # an AI agent, NOT a human — never invent a persona, backstory, or location
  stance: >-
    builder-to-builder, first person, witty, no corporate fluff, plain simple English (GED level
    — see readability block below)
  # owner direction 2026-10-03: "the audience is early college people so they need to click" —
  # see links: below for the absolute-URL rule this reader needs
  reader: >-
    an early-college student, new to these AI tools, who should be able to click straight
    through from the post to try each project right now
  # binding; see grounding: below for what this means for git as a source
  post_is: a product update — what the reader can now DO, not the engineering it took
  purpose: see distribution.objective below — every post is written to serve that objective

distribution:
  # owner direction 2026-10-03, verbatim: "I want to eventually make this blog even more public
  # by double-publishing to linkedIN - make sure that objective is already baked into the
  # grouding for it - talking about hte projects I work on will drive traffic. so the language
  # can't be marketing but urls need be real and we let the landing page convert"
  objective: >-
    posts about the projects drive traffic to each project's landing page; the landing page
    converts, the post does not sell
  channels:
    bilko.run/blog: live
    linkedin: "planned — cross-post of the same text, not yet automated; this pipeline does not
      post to LinkedIn today"
  syndication_ready: true      # a post must stand alone off-site: no "last post", "see above", or
                                # "on this blog" references; every link absolute; the first two
                                # sentences carry the cool part, since LinkedIn shows no site chrome
  primary_link: "project landing page per links: host-kind rules below"
  no_marketing_language: true
  marketing_blocklist:         # scripts/blog-readability.ts reads this exact key path
    - sign up now
    - don't miss
    - game-changer
    - game changer
    - revolutionary
    - unlock
    - level up
    - supercharge
    - best-in-class
    - world-class
    - cutting-edge
    - limited time
    - act now
    - buy now
    - skyrocket
    - must-have

grounding:                  # WHAT git/commit history is FOR in this pipeline — read this before
                             # research.md or voice.md, both of which must agree with it
  git_selects: focus and window only     # which project, and which date range, to write about —
                                          # nothing more
  git_does_not_supply: subject matter    # the post's BODY is the project's value and how a reader
                                          # uses it — never a narration of the commits, bugs, error
                                          # codes, or internal refactors that prompted writing about
                                          # it. A post that opens on an error code or spends its
                                          # middle on retry-suffix internals has confused "how I
                                          # picked this project" with "what this project is worth."
  spotlight_mode_exception: >
    cadence.no_new_work_fallback: spotlight picks its focus by LEDGER COVERAGE AGE (never-covered
    first, then oldest-last-covered — see scripts/blog-cadence-watchdog.sh's spotlight_candidates),
    not by git activity at all. git still supplies nothing about the post's body even then — the
    spotlight is grounded in the candidate's live tile, README, and source.
  owner_correction: >
    2026-09-12, verbatim — "The blog is way too literal about the git. The git as grounding is
    meant to be about the figuring out the focus was the project. The blog is not to spell out
    every bug but to say I worked on the project and use the opportunity to highlight value of the
    project and how to be used." Binding; identity.post_is above already states this — this block
    exists because prose in research.md and voice.md previously licensed the opposite and won.
  value_claims_still_need_sources: true  # swapping engineering detail for value claims does NOT
                                          # license unsourced marketing prose — see truth: below.
                                          # Every value claim still needs a real artifact or number,
                                          # sourced via ground.md (MCP reads, scorecards, KPI
                                          # scripts, DB queries). ground.md matters MORE under this
                                          # rule, not less: it is the sanctioned way to back a value
                                          # claim with something real instead of a vibe.
  ineligible_subject: >
    A project with NO user-facing surface at all — no /projects tile, nothing a reader could go
    try — is INELIGIBLE as a focused post's sole subject. If the only rotation-eligible candidate
    is such a project, either pick a different eligible project (rotation.md) or, with explicit
    user override, mention it as portfolio CONTEXT only (a sentence inside a wider post) — never
    give it a standalone post with an invented "how to use it."

cadence:
  scan_every_days: 1              # SCANNING IS DAILY AND INDEPENDENT OF WHETHER A POST IS DUE —
                                   # the watchdog runs phases 1-2 (Rotation, Scan) every day
                                   # regardless of the publish gap; only phases 6-7 (Approve, Seed)
                                   # are gated on target_gap_days below. The actual daily trigger is
                                   # the systemd/cron timers (docs/blog-watchdog.md), not this
                                   # value; blog-cadence-watchdog.sh FATALs if this ever drifts
                                   # from 1, so the two stay honest with each other.
  target_gap_days: [3, 4]        # owner policy: publish every 3-4 days. LOWER bound (3) gates "a
                                  # post is due" for publishing; UPPER bound (4) is the stall
                                  # threshold — the over-cadence/stall heartbeat classification
                                  # (heartbeat_status_for_outcome).
  min_gap_days: 3                # HARD rule: no two posts may publish less than this many days
                                 # apart. This is code-enforced (scripts/blog-cadence-gate.ts) and
                                 # no override — including rotation.override — may bypass it.
  min_gap_enforced_since: '2026-10-01T00:00:00.000Z' # only pairs whose LATER post is at/after this
                                 # timestamp are checked; this is a HARD rule with no override,
                                 # including rotation.override, from this date forward.
  catchup_trigger_days: 10       # gap beyond this → catch-up mode (backfill queue)
  backdating: honest-only        # a backdated published_at must match when the WORK shipped;
                                 # never backdate a post about work that hadn't happened yet
  no_new_work_fallback: spotlight # when a post is due and no rotation-eligible project has new
                                 # work in the window, write an evergreen FEATURE SPOTLIGHT on the
                                 # most-overdue tiled project instead of skipping (SEED_RESULT: noop
                                 # / cooldown_blocked are reserved for when even that is exhausted —
                                 # see scripts/blog-cadence-watchdog.sh's spotlight_candidates)
  current_post_published_at: authored_at # portfolio/focused/spotlight posts are dated the moment
                                 # they are authored, not the ship date of the work they describe;
                                 # only catch-up mode's backfill posts are honestly backdated
                                 # (backdating: honest-only above still governs those)
  pending_draft_alert_days: 2    # applies ONLY when autonomy.autonomous_publish is false: age
                                 # (whole days, by file mtime) at which a still-pending draft
                                 # escalates the watchdog heartbeat from ok: to warn:

rotation:
  project_cooldown_posts: 3            # a project covered in ANY of the last N ledger rows is
                                        # INELIGIBLE as the next post's primary subject. Evaluated
                                        # against blog-ledger.md's recorded per-post rows (the
                                        # ledger IS the rotation memory), never against a heuristic
                                        # reading of post titles. never_repeat_previous_project
                                        # below is the degenerate N=1 case of this same rule — kept
                                        # for backward-compatible prose, but the cooldown of 3 is
                                        # the binding constraint.
  never_repeat_previous_project: true
  max_consecutive_untiled_posts: 1     # untiled = slug not in tile_registry
  tile_registry: src/data/standalone-projects.json   # host repo, the ONLY tile authority
  memory: blog-ledger.md               # append a row per post, same commit as the seed
  override: user-explicit-only         # violating a rule requires the user saying so

tones:                                  # pick exactly ONE per post; record it in the ledger
  changelog:        { words: [250, 450], shape: "1 hero change + 'Also shipped' bullets", payload: required_value_use_payload }
  shipped-note:     { words: [350, 600], shape: "what I shipped, the one decision, what's next", payload: required_value_use_payload }
  problem-outcome:  { words: [400, 600], shape: "open on the user's pain, land on what they can now do", payload: required_value_use_payload }
  field-note:       { words: [500, 800],
                      shape: "one hard bug/decision used as PROOF of a value/use point, NOT as the
                        subject itself — the value/use point is the spine, the bug is supporting
                        color that earns it credibility. A field-note whose bug/decision IS the
                        subject, with no value/use point it serves, fails the payload requirement
                        below just like every other tone.",
                      extras: ["what I'd do differently (concrete)", "FAQ only if each entry adds a new angle"],
                      payload: required_value_use_payload }
  metric-update:    { words: [300, 550], shape: "lead with the number that moved, then the 1-2 changes that moved it", payload: required_value_use_payload }
  spine: was -> now -> next            # every post, regardless of tone
  required_value_use_payload: >
    Mandatory for EVERY tone above, regardless of shape — a post missing this fails the phase-5
    self-check (SKILL.md) even if it is well-written and correctly grounded. The post must state,
    in prose woven into the tone's own shape (not a bolted-on section): (1) what the project IS FOR
    — one plain sentence a newcomer understands; (2) WHO it helps, or what job it does for them;
    (3) CONCRETELY how a reader starts using it right now, naming the correct link per `links:`
    below's host-kind rules. This is prose plus the one correct link — `links.max_ctas_per_post: 1`
    still caps it, this is not licence for a pile of CTAs.

readability:                           # owner direction, 2026-10-02, verbatim: "it used GED
                                        # language or langeu that the govement uses - simple
                                        # english." Enforced by scripts/blog-readability.ts
                                        # (landed by the previous PRD) — keys below MUST match the
                                        # names that script's loadThresholdsFromConfig() reads.
  standard: 'US Federal Plain Language Guidelines (plainlanguage.gov)'
  reading_level: 'GED / about 8th grade'
  max_fk_grade: 8
  max_avg_sentence_words: 18
  long_sentence_words: 25
  max_long_sentences: 2
  jargon_blocklist:                    # at minimum the defaults in scripts/blog-readability.ts
                                        # DEFAULT_THRESHOLDS — keep the two lists in sync
    - { term: leverage, suggestion: use }
    - { term: utilize, suggestion: use }
    - { term: robust, suggestion: strong }
    - { term: seamless, suggestion: smooth }
    - { term: orchestrate, suggestion: run }
    - { term: idempotent, suggestion: safe to repeat }
    - { term: latency, suggestion: delay }
    - { term: deprecate, suggestion: retire }
    - { term: facilitate, suggestion: help }
    - { term: synergy, suggestion: teamwork }
    - { term: paradigm, suggestion: model }
    - { term: bandwidth, suggestion: time }
    - { term: holistic, suggestion: complete }
    - { term: streamline, suggestion: simplify }
    - { term: actionable, suggestion: useful }
    - { term: scalable, suggestion: able to grow }
    - { term: optimize, suggestion: improve }
    - { term: mitigate, suggestion: reduce }
  checker: 'npx tsx scripts/blog-readability.ts <draft.md>'

angle:                                 # owner direction, 2026-10-02, verbatim: "Focus on cool
                                        # side of the project and the features you are blogging
                                        # about." This is the LEAD, not a late beat.
  lead_with: >
    The coolest thing a reader can do, see, or play with in the project — the fun or impressive
    part — told as what it feels like to use it, not as a feature list.
  engineering_detail_is_excluded_unless: >
    Bugs, refactors, and internal plumbing are left OUT of the post. The only exception: one
    sentence of it may stay IF that sentence makes the cool part more believable (a fact that
    backs the claim), never as a story told for its own sake.

categories: [build-log, lessons, deep-dive, market, product]

truth:
  every_number_needs_a_source: true    # commit sha, scorecard, MCP read, DB query, or doc — named or implied
  no_invented_metrics: true
  period_correctness: >
    Numbers in a backdated post must belong to that date's regime; prefer operational-DB
    history over today's live scorecard when a KPI was redefined after the slot date.
  no_epilogue_knowledge: >
    Later verdicts on the covered work (e.g. a fix graded NO-EFFECT afterwards) stay out of a
    backdated post; the honest in-period hedge is allowed, the grade belongs to the next post.
  show_the_mistake: false              # 2026-10-02: superseded by angle: above — lead with the
                                        # cool part, not the break; see angle.lead_with

scan:
  source_of_truth: github              # gh api, never local working trees, for pushed repos
  owner: StanislavBG
  host_repo: StanislavBG/bilko-run     # least representative repo — dominated by cron commits
  cron_noise_filter: "dashboard snapshot|hourly refresh|hourly snapshot|publish.*snapshot"
  local_reconciliation: required       # repos with no remote or unpushed-ahead are invisible to gh
  unpushed_watchlist_lives_in: blog-ledger.md

links:                                  # derive from tile_registry host.kind per project
  static-path: "https://bilko.run/projects/<slug>/"   # absolute, TRAILING slash
  external-url: "link the external/GitHub URL directly"
  react-route: "https://bilko.run/products/<slug>"    # absolute
  untiled: "link GitHub only if the work is actually pushed; otherwise no code link"
  cross-post: "https://bilko.run/blog/<slug>"         # absolute
  max_ctas_per_post: 1
  absolute_urls_only: true             # owner direction 2026-10-03 — readers must be able to
                                        # click straight through; the readability checker
                                        # (scripts/blog-readability.ts findLinkIssues) FAILS the
                                        # draft on any relative link (a bare /projects/<slug>/
                                        # path or a markdown link whose target isn't https://)
  source_repo: >-
    Whenever a post says the code is open source, is on GitHub, or can be forked, link the real
    repo: 'https://' + that project's tile_registry entry's host.sourceRepo (src/data/
    standalone-projects.json). This repo link is required grounding for the claim, not a CTA —
    it does NOT count against max_ctas_per_post above.

gates:                                  # a phase may not hand off until its gate passes
  1_rotation: ledger permits the project (or user override)
  2_scan: window from db.ts seeds; all repos enumerated; local-only pass ran; cron noise filtered
  3_research: structured notes per story unit; slot dates re-verified vs commit dates; push status known
  4_ground: every number traced to a queried source
  5_draft: >-
    one tone held within its word range; bot-tell blocklist clean; spine present; readability
    checker exits 0 (npx tsx scripts/blog-readability.ts <draft.md> — plain-language gate, see
    the readability block above); marketing_blocklist clean and post stands alone off-site
    (syndication_ready — see distribution: above)
  6_approve: autonomous gate — autonomy.autonomous_publish is true AND the phase-4/5 quality
    self-check (SKILL.md) passed; when autonomous_publish is false, this reverts to requiring an
    EXPLICIT USER OK, and peers/agents still cannot approve on the owner's behalf
  7_seed: tsc clean; db tests green; ledger row + rotation state updated in the SAME commit; commit
    uses explicit pathspecs only (never `git add -A`/`.`/`-a`); pushed to origin main ONLY;
    live pickup verified at /api/blog after Render deploys

seed_mechanics:
  file: server/db.ts                   # INSERT OR IGNORE blocks in initDb()
  new_slugs_reach_production: true     # on next deploy boot (verified 2026-07-24)
  edits_to_deployed_posts: admin blog API only (server/routes/blog.ts) — the seed edit is ignored
  published_at: explicit ISO string, never new Date()
  push_remote: origin                  # StanislavBG/bilko-run main — NEVER content-grade

autonomy:                               # OWNER'S CONTROL SURFACE — Bilko is an autonomous agent,
                                         # not a human-supervised pipeline; this block is how the
                                         # owner governs that, not an interactive OK.
  autonomous_publish: true              # MASTER KILL SWITCH. false restores the human-gated
                                         # phases-1-5-only behavior verbatim (draft, then wait for
                                         # an explicit human OK before phase 6/7 ever run).
  max_posts_per_run: 1                  # cap on posts a single run may seed, even in catch-up mode;
                                         # remaining queued posts are left for subsequent runs
  push_remote: origin                   # StanislavBG/bilko-run main — NEVER content-grade
  push_branch: main
  allowed_commit_paths:                 # the ONLY paths an autonomous seed commit may stage —
                                         # explicit pathspecs only, never `git add -A`/`.`/`-a`
    - server/db.ts
    - .claude/skills/blog-from-git/blog-ledger.md
  verify_deploy_timeout_seconds: 900     # bounded post-publish poll: how long to wait for a
                                         # seeded slug to appear at /api/blog before treating
                                         # Render's auto-deploy as stuck. A starting point, not a
                                         # measured value — deploy latency varies.
  verify_deploy_interval_seconds: 60     # how often to re-poll /api/blog during that window
