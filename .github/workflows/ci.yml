name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Identity scan
        # Fails when a tracked file holds the owner's real name or personal email
        # (docs/identity-boundary.md). The strings live only in the secret. GitHub withholds
        # it from fork pull requests, so only a pull request may skip; a push must scan.
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: |
          if [ -z "$IDENTITY_DENYLIST" ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::IDENTITY_DENYLIST secret not available; identity scan skipped (docs/identity-boundary.md)"
              exit 0
            fi
            echo "::error::IDENTITY_DENYLIST secret not set; identity scan cannot run (docs/identity-boundary.md)"
            exit 1
          fi
          list=$(mktemp)
          printf '%s\n' "$IDENTITY_DENYLIST" > "$list"
          BILKO_IDENTITY_DENYLIST="$list" bash scripts/identity-guard.sh tree

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0  (version from root packageManager)

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # The persona assertions read the strings here (tests/identity-denylist.ts).
        env:
          IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
        run: pnpm test

      - name: Test host-kit
        run: pnpm --filter host-kit test

      - name: Build
        run: pnpm build
