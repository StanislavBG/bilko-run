        const u = rm ? 1 : prog(t, a, 0.45);
        const off = rm ? 0 : (1 - easeOutBack(u)) * -60;
        const op = rm ? 1 : prog(t, a, 0.1);
        spans += `<tspan dy="${f2(off - prev)}" fill-opacity="${f2(op)}">${word[i]}</tspan>`;
        prev = off;
      }
      s += `<text class="f" x="${CX}" y="138" font-size="96" font-weight="900" text-anchor="middle" fill="${C.ink}">${spans}</text>`;
    }
    s += T(CX, 198, 'Your Git, your Résumé.', { anchor: 'middle', size: 34, w: 800, fill: C.red, op: rm ? 1 : prog(t, 24.6, 0.3) });
    const chips = [
      { text: 'Free to start', fill: C.green, tc: C.white, x: CX - 240 },
      { text: 'No sign-in', fill: C.yel, tc: C.ink, x: CX },
      { text: 'Résumé PDF', fill: C.white, tc: C.ink, x: CX + 240 },
    ];
    chips.forEach((c, i) => {
      const sc = popAt(t, 24.55 + i * 0.2, 0.4, rm);
      if (sc <= 0) return;
      s += `<g transform="translate(${c.x} 254) scale(${f2(sc)})"><path d="${rr(-108, -26, 216, 52, 26)}" fill="${c.fill}" stroke="${C.ink}" stroke-width="4"/>`
        + T(0, 9, c.text, { anchor: 'middle', size: 24, w: 900, fill: c.tc }) + '</g>';
    });
    // the full link, plain text
    {
      const sc = popAt(t, 25.3, 0.45, rm);
      if (sc > 0) {
        const pulse = rm ? 1 : 1 + 0.015 * Math.sin(Math.max(0, t - 26) * 4);
        s += `<g transform="translate(${CX} 344) scale(${f2(sc * pulse)})"><path d="${rr(-385, -36, 770, 72, 36)}" fill="${C.red}" stroke="${C.ink}" stroke-width="4"/>`
          + T(0, 11, 'https://bilko.run/projects/git-viewer/', { anchor: 'middle', size: 31, w: 800, fill: C.white, mono: true }) + '</g>';
      }
    }
    // the hand-picked list, with room for the next name
    if (rm || t >= 26.0) {
      const u = rm ? 1 : prog(t, 26.0, 0.45);
      const op = rm ? 1 : prog(t, 26.0, 0.15);
      s += `<g transform="translate(${CX} ${f2(506 + lerp(70, 0, easeOutBack(u)))})" opacity="${f2(op)}">`
        + `<path d="${rr(-270, -84, 540, 168, 16)}" fill="${C.white}" stroke="${C.ink}" stroke-width="4"/>`
        + T(0, -50, 'BUILT BY OUR USERS', { anchor: 'middle', size: 20, w: 900, ls: 3, op: 0.75 })
        + T(-230, -6, '1.', { size: 28, w: 900 }) + T(-192, -6, 'bidyut10', { mono: true, size: 28, w: 700 })
        + T(-20, -6, '· built Nov 7', { size: 24, w: 700, op: 0.7 })
        + `<path d="M182 -18L198 -2L232 -40" fill="none" stroke="${C.green}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
      const nu = rm ? 1 : prog(t, 27.4, 0.35);
      if (nu > 0) {
        const wig = rm ? 0 : Math.sin(Math.max(0, t - 27.4) * 9) * 3 * (1 - prog(t, 28.2, 0.8));
        s += `<g transform="translate(0 44) rotate(${f2(wig)}) scale(${f2(rm ? 1 : easeOutBack(nu))}) translate(0 -44)" opacity="${f2(rm ? 1 : clamp01(nu * 3))}">`
          + `<path d="${rr(-250, 18, 500, 52, 14)}" fill="${C.cream}" stroke="${C.red}" stroke-width="4" stroke-dasharray="14 10"/>`
          + T(-230, 54, '2.', { size: 28, w: 900, fill: C.red }) + T(-192, 54, 'you?', { size: 30, w: 900, fill: C.red }) + '</g>';
      }
      s += '</g>';
    }
    // confetti burst from the empty slot
    if (!rm && t >= 27.75) {
      const dt = t - 27.75;
      const fade = 1 - prog(t, 29.2, 0.8);
      for (const p of CONF) {
        const x = CX + p.vx * dt;
        const y = 546 + p.vy * dt + 0.5 * 1400 * dt * dt;
        if (y > 760) continue;
        s += `<rect x="${f2(x - p.w / 2)}" y="${f2(y - p.h / 2)}" width="${f2(p.w)}" height="${f2(p.h)}" fill="${p.col}" stroke="${C.ink}" stroke-width="1" opacity="${f2(fade)}" transform="rotate(${f2(p.rot + p.vr * dt)} ${f2(x)} ${f2(y)})"/>`;
      }
    }
    return s;
  };

  const PANELS = [drawK1, drawK2, drawK3, drawK4, drawK5];

  // ---------- host: Bilko (and Pesho at the close) in screen space ----------
  const SEG = [
    [0.0, 1.5, 'wave', 'happy', 640, 160],
    [1.5, 3.3, 'idle', 'happy', 790, 150],
    [3.3, 5.1, 'idle', 'worried', 450, 400],
    [5.1, 6.3, 'point', 'curious', 940, 380],
    [6.3, 7.4, 'idle', 'happy', 940, 380],
    [7.4, 8.5, 'walk', 'happy', 900, 420],
    [8.5, 9.8, 'point', 'excited', 680, 300],
    [9.8, 12.6, 'idle', 'happy', 790, 330],
    [12.6, 13.7, 'walk', 'happy', 900, 420],
    [13.7, 14.6, 'idle', 'surprised', 1078, 200],
    [14.6, 16.0, 'idle', 'excited', 820, 584],
    [16.0, 17.2, 'jump', 'excited', 560, 480],
    [17.2, 17.8, 'idle', 'happy', 800, 400],
    [17.8, 18.9, 'walk', 'happy', 900, 420],
    [18.9, 20.2, 'point', 'happy', 570, 280],
    [20.2, 21.2, 'idle', 'happy', 800, 262],
    [21.2, 23.6, 'idle', 'smug', 820, 520],
    [23.6, 24.7, 'walk', 'happy', 900, 420],
    [24.7, 27.6, 'idle', 'happy', 845, 338],
    [27.6, 29.1, 'celebrate', 'excited', 845, 300],
    [29.1, 30.01, 'idle', 'happy', 845, 338],
  ];
  const TRACK = Array.from(MOUTH, (ch) => (ch === '.' ? 0 : Number(ch)));
  const bilkoX = (t, rm) => {
    if (rm) return t >= KS[4].s ? 262 : 180;
    return lerp(180, 262, easeInOut(prog(t, 23.6, 1.1)));
  };
  const drawHost = (t, rm) => {
    const ctx = new window.BilkoCast.Ctx(1280, 720);
    let seg = SEG[SEG.length - 1];
    for (const sg of SEG) if (t >= sg[0] && t < sg[1]) { seg = sg; break; }
    const action = seg[2];
    // one-shot gestures (wave, point, jump, celebrate) run from their segment start; loops use the clock
    const at = action === 'idle' || action === 'walk' ? t : t - seg[0];
    const ki = kIndex(t);
    const opts = {
      x: bilkoX(t, rm), y: 702, scale: 330, facing: 'right', expression: seg[3], action, t: at,
      lookAt: { x: seg[4], y: seg[5] },
    };
    if (t >= 21.2 && t < 23.6) opts.prop = 'notebook';
    if (rm) {
      // a still keystone: no gestures, no lip-sync
      const last = SEG.filter((sg) => sg[0] < KS[ki].e && sg[1] > KS[ki].s && sg[2] !== 'walk').pop() || seg;
      opts.action = 'idle';
      opts.t = 0.3;
      opts.expression = last[3];
      opts.lookAt = { x: last[4], y: last[5] };
    } else {
      const f = Math.floor(t * 30);
      if (f >= 0 && f < MOUTH.length && MOUTH[f] !== '.') {
        opts.mouthTrack = TRACK;
        opts.tMaster = t;
      }
    }
    window.BilkoCast.drawBilko(ctx, opts);
    // Pesho trots in for the close and barks at the end
    if (t >= 23.6) {
      const u = rm ? 1 : prog(t, 23.75, 0.9);
      const px = lerp(-160, 96, easeOutBack(u));
      const happy = !rm && (t < 24.7 || t >= 28.85);
      window.BilkoCast.drawPesho(ctx, { x: px, y: 704, scale: 300, facing: 'right', action: happy ? 'happy' : 'idle', t: t });
    }
    return ctx.markup();
  };

  // ---------- captions (screen space, black on white) ----------
  const drawCaption = (t, rm) => {
    let c = null;
    for (const cp of CAPS) if (t >= cp.s && t < cp.e) c = cp;
    if (!c) c = CAPS[CAPS.length - 1];
    const u = rm ? 1 : prog(t, c.s, 0.3);
    const out = rm || c === CAPS[CAPS.length - 1] ? 1 : 1 - prog(t, c.e - 0.12, 0.12);
    const sc = rm ? 1 : lerp(0.85, 1, easeOutBack(u));
    const len = c.text.length;
    const size = Math.min(29, 830 / (len * 0.54));
    return `<g transform="translate(805 658) scale(${f2(sc)})" opacity="${f2(Math.min(clamp01(u * 3), out))}">`
      + `<path d="${rr(-445, -32, 890, 64, 20)}" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/>`
      + `<path d="M-445 -12V12" stroke="${C.yel}" stroke-width="12" stroke-linecap="round"/>`
      + `<path d="${rr(-425, 24, 120, 6, 3)}" fill="${C.red}"/>`
      + T(10, size * 0.36, c.text, { anchor: 'middle', size: f2(size), w: 800 }) + '</g>';
  };

  // ---------- frame renderer: a pure function of t ----------
  const $ = (id) => document.getElementById(id);
  const el = {};
  const rmQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reduced = () => !!(rmQuery && rmQuery.matches);
  const render = (tIn) => {
    const rm = reduced();
    const ki = kIndex(tIn);
    // reduced motion: each keystone is a still, cut on the video's own clock
    const t = rm ? Math.min(KS[ki].e - 0.02, D - 0.02) : tIn;
    const cam = camAt(t, rm);
    const camT = `translate(640 360) scale(${f2(cam.z)}) translate(${f2(-cam.x)} ${f2(-cam.y)})`;
    el.world.setAttribute('transform', camT);
    el.far.setAttribute('transform', `translate(640 360) scale(${f2(1 + (cam.z - 1) * 0.3)}) translate(${f2(-cam.x * 0.3)} ${f2(-cam.y * 0.3)})`);
    el.near.setAttribute('transform', `translate(640 360) scale(${f2(1 + (cam.z - 1) * 0.65)}) translate(${f2(-cam.x * 0.65)} ${f2(-cam.y * 0.65)})`);
    // draw the current keystone, plus the previous one while the camera leaves it
    let dyn = '';
    const show = [ki];
    if (!rm && ki > 0 && t < KS[ki].s + MOVE) show.unshift(ki - 1);
    for (const i of show) {
      const ti = i === ki ? t : KS[i].e - 0.001;
      dyn += `<g transform="translate(${KS[i].ox} ${KS[i].oy})">${PANELS[i](ti, rm)}</g>`;
    }
    el.dyn.innerHTML = dyn;
    el.host.innerHTML = drawHost(rm ? t : tIn, rm);
    el.cap.innerHTML = drawCaption(tIn, rm);
  };

  // ---------- one clock, wired to the narration ----------
  const audio = $('vo');
  let t = 0;
  let playing = false;
  let t0 = 0;
  let wall0 = 0;
  let raf = 0;
  const clampT = (x) => Math.max(0, Math.min(D, x));
  const ev = ['pointerdown', 'keydown'];
  let armed = false;
  const disarm = () => {
    if (!armed) return;
    armed = false;
    ev.forEach((e) => document.removeEventListener(e, go));
  };
  const go = () => {
    disarm();
    if (playing && t < D) {
      try { audio.currentTime = t; } catch (e) { /* not seekable yet */ }
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    }
  };
  const arm = () => {
    if (armed) return;
    armed = true;
    ev.forEach((e) => document.addEventListener(e, go));
  };
  const startAudio = () => {
    try { audio.currentTime = t; } catch (e) { /* not seekable yet */ }
    const p = audio.play();
    if (p && p.catch) p.catch(() => arm());
  };
  const tick = () => {
    raf = 0;
    if (!playing) return;
    t = clampT(t0 + (performance.now() - wall0) / 1000);
    render(t);
    if (!audio.paused && t < D - 0.3 && Math.abs(audio.currentTime - t) > 0.3) {
      try { audio.currentTime = t; } catch (e) { /* ignore */ }
    }
    if (t >= D) {
      playing = false;
      audio.pause();
      return;
    }
    raf = requestAnimationFrame(tick);
  };
  const play = () => {
    if (playing) {
      if (audio.paused && t < D) startAudio();
      return;
    }
    if (t >= D) t = 0;
    playing = true;
    t0 = t;
    wall0 = performance.now();
    startAudio();
    if (!raf) raf = requestAnimationFrame(tick);
  };
  const pause = () => {
    playing = false;
    if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
    audio.pause();
  };
  const seek = (x) => {
    t = clampT(Number(x) || 0);
    t0 = t;
    wall0 = performance.now();
    render(t);
    try { audio.currentTime = t; } catch (e) { /* not seekable yet */ }
  };
  const restart = () => {
    seek(0);
    play();
  };
  const setMuted = (m) => {
    audio.muted = !!m;
    if (!m && playing && audio.paused && t < D) startAudio();
  };

  const init = () => {
    el.world = $('world');
    el.far = $('far');
    el.near = $('near');
    el.dyn = $('dyn');
    el.host = $('host');
    el.cap = $('cap');
    el.far.innerHTML = para(11, 0.3, 46, 'far');
    el.near.innerHTML = para(23, 0.65, 64, 'near');
    $('wstatic').innerHTML = staticWorld();
    render(0);
    play();
  };

  window.smDemo = {
    duration: D,
    seek,
    play,
    pause,
    restart,
    setMuted,
    getTime: () => (playing ? clampT(t0 + (performance.now() - wall0) / 1000) : t),
    isPlaying: () => playing,
    scenes: SCENES,
  };
  init();
})();

</script>
</body>
</html>
