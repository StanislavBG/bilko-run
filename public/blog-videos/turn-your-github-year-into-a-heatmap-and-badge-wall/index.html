<title>Turn Your GitHub Year Into a Heatmap and Badge Wall</title>
<style>
:root{--bg:#fbf6f0;--fg:#2a1d14;--mut:#6b574a;--acc:#e8590c;--card:#fff}

*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#fit{width:1280px;height:720px;transform-origin:center center;flex:none}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--fg)}
.sc{position:absolute;inset:0;opacity:0;pointer-events:none}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px;gap:22px}
.h1{font-size:62px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.h1 em{color:var(--acc);font-style:normal}
.sub{font-size:28px;color:var(--mut)}
.shot{position:absolute;inset:0;overflow:hidden;background:#17110d}
.shot img{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;will-change:transform}
.dim img{filter:brightness(.35)}
.box{position:absolute;border:4px solid var(--acc);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.0),0 0 24px rgba(255,138,61,.7);opacity:0}
.call{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--acc);color:#1d0f05;font-weight:800;font-size:32px;padding:14px 28px;border-radius:14px;white-space:nowrap;opacity:0}
.url{font-size:36px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);padding:14px 26px;border-radius:14px;word-break:break-all}
.sq{position:absolute;width:56px;height:56px;border-radius:10px;background:var(--acc);opacity:0}
#snd{position:absolute;right:16px;bottom:16px;display:none;font:700 16px system-ui;padding:10px 16px;border-radius:999px;border:0;background:var(--acc);color:#1d0f05;cursor:pointer;z-index:9}
#step{position:absolute;right:16px;top:16px;display:none;font:700 16px system-ui;padding:10px 16px;border-radius:999px;border:0;background:var(--acc);color:#1d0f05;cursor:pointer;z-index:9}
#bar{position:absolute;left:0;bottom:0;height:5px;background:var(--acc);width:0;z-index:8}
</style></head><body>

    sc[i].style.opacity = on ? String(Math.min(1, cl(p * 8), cl((1 - p) * 8) + (idx === 5 ? 1 : 0))) : "0";
  }
  const k = K[idx];
  if (k) {
    const img = $(k[0]);
    const s = 1 + (k[5] - 1) * ease(p);
    img.style.transformOrigin = k[3] + "px " + k[4] + "px";
    img.style.transform = reduce ? "none" : "scale(" + s + ")";
    const b = $(k[1]);
    const bp = ease((p - 0.2) * 3);
    b.style.opacity = String(bp);
    b.style.transformOrigin = (k[3] - b.offsetLeft) + "px " + (k[4] - b.offsetTop) + "px";
    b.style.transform = reduce ? "none" : "scale(" + s + ")";
    const c = $(k[2]);
    const cp = ease((p - 0.1) * 4);
    c.style.opacity = String(cp);
    c.style.marginBottom = (1 - cp) * -20 + "px";
  }
  if (idx === 1) {
    const h = sc[1];
    h.style.transform = "translateY(" + (reduce ? 0 : (1 - ease(p * 3)) * 24) + "px)";
  } else sc[1].style.transform = "none";
  $("bar").style.width = (tt / D) * 100 + "%";
};
let t = 0, playing = false, last = 0;
const sync = () => { if (Math.abs(aud.currentTime - t) > 0.25) aud.currentTime = t; };
const frame = (now) => {
  if (!playing) return;
  const dt = (now - last) / 1000; last = now;
  t = aud.paused ? t + dt : aud.currentTime;
  if (t >= D) { t = D; playing = false; render(D); aud.pause(); return; }
  render(t);
  requestAnimationFrame(frame);
};
const pause = () => { playing = false; aud.pause(); };
const play = () => {
  if (t >= D) t = 0;
  playing = true; last = performance.now();
  aud.currentTime = t;
  const r = aud.play();
  if (r && r.catch) r.catch(() => { $("snd").style.display = "block"; });
  requestAnimationFrame(frame);
};
const seek = (v) => { t = Math.max(0, Math.min(D, +v || 0)); aud.currentTime = t; render(t); };
$("snd").addEventListener("click", () => { $("snd").style.display = "none"; aud.play(); });
window.smDemo = { duration: D, seek, play, pause };
if (reduce) {
  $("step").style.display = "block";
  let n = 0;
  const mids = [2, 6.5, 12.5, 19, 24, 28];
  const show = () => { t = mids[n]; render(t); };
  $("step").addEventListener("click", () => { n = (n + 1) % 6; show(); });
  window.smDemo.play = () => show();
  show();
} else {
  render(0);
  play();
}
})();
</script></body></html>
