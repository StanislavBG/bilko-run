<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Escape Velocity</title>
		<meta name="description" content="Escape Velocity: a keyboard-only spaceship game — an unhurried fogged galaxy to explore, and a survivors arena to warp into.">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e8e8f0;
	background-color: #05050a;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#canvas {
	display: block;
	background-color: #05050a;
}

#canvas:focus {
	outline: none;
}

#overlay {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background-color: #05050a;
}

#card {
	max-width: 32rem;
	width: 90%;
	padding: 2.5rem 2rem;
	border-radius: 0.75rem;
	border: 1px solid #2a2a3a;
	background-color: #0b0b16;
	text-align: center;
	box-shadow: 0 0 2rem rgba(0, 0, 0, 0.6);
}

#card h1 {
	margin: 0 0 0.5rem;
	font-size: 2rem;
	letter-spacing: 0.04em;
	color: #f5f5ff;
}

#tagline {
	margin: 0 0 1.25rem;
	color: #a8a8c0;
	font-size: 1rem;
}

#controls-hint {
	margin: 0 0 1.75rem;
	color: #7a7a95;
	font-size: 0.85rem;
	letter-spacing: 0.02em;
}

#play {
	font: inherit;
	font-size: 1.1rem;
	font-weight: 600;
	color: #05050a;
	background-color: #7fd1ff;
	border: none;
	border-radius: 0.5rem;
	padding: 0.75rem 2rem;
	cursor: pointer;
}

#play:hover {
	background-color: #a3ddff;
}

#play:disabled {
	opacity: 0.6;
	cursor: default;
}

#loading {
	width: 100%;
}

#loading[hidden], #status-notice[hidden] {
	display: none;
}

#status-progress {
	width: 100%;
	margin: 0 0 0.75rem;
}

#loading-text {
	margin: 0;
	color: #a8a8c0;
	font-size: 0.9rem;
}

#status-notice {
	color: #e0b0b0;
	font-size: 0.9rem;
	line-height: 1.4;
	text-align: left;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="-1" aria-label="Starry Night Ships II">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="overlay">
			<div id="card">
				<h1>Escape Velocity</h1>
				<p id="tagline">An unhurried fogged galaxy to explore, and a survivors arena to warp into.</p>
				<p id="controls-hint">A/D turn &middot; W/Space fly &middot; hold Space descend &middot; Esc menu</p>
				<button id="play" type="button">Click to play</button>
				<div id="loading" hidden>
					<progress id="status-progress"></progress>
					<p id="loading-text">Loading&hellip;</p>
				</div>
				<div id="status-notice" hidden></div>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14637500,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('overlay');
	const playButton = document.getElementById('play');
	const loading = document.getElementById('loading');
	const statusProgress = document.getElementById('status-progress');
	const loadingText = document.getElementById('loading-text');
	const statusNotice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');

	function bytesToMB(bytes) {
		return (bytes / 1000000).toFixed(1);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.hidden = false;
	}

	function displayFailureNotice(err) {
		console.error(err);
		playButton.hidden = true;
		loading.hidden = true;
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		playButton.hidden = true;
		setStatusNotice('Your browser is missing features required to run this game:\n' + missing.join('\n'));
	} else {
		playButton.addEventListener('click', function () {
			playButton.disabled = true;
			playButton.hidden = true;
			loading.hidden = false;
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
						loadingText.textContent = 'Loading… ' + bytesToMB(current) + ' MB / ' + bytesToMB(total) + ' MB';
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
						loadingText.textContent = 'Loading…';
					}
				},
			}).then(() => {
				overlay.remove();
				canvas.focus();
			}, displayFailureNotice);
		});
	}
}());
		</script>
	</body>
</html>
